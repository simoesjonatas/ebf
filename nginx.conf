upstream ebf_app {
    server web:8000;
}

server {
    listen 80;
    server_name localhost ebf.simoesti.com.br;
    client_max_body_size 10M;

    location /static/ {
        alias /app/ebf_project/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /media/ {
        alias /app/ebf_project/media/;
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        proxy_pass http://ebf_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $server_name;
        proxy_redirect off;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Servir favicon e robots.txt
    location = /favicon.ico {
        alias /app/ebf_project/static/favicon.ico;
        expires 30d;
    }

    location = /robots.txt {
        alias /app/ebf_project/static/robots.txt;
        expires 30d;
    }
}
