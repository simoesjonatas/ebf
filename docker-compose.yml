version: '3.9'

services:
  db:
    image: postgres:15-alpine
    container_name: ebf_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ebf_db}
      POSTGRES_USER: ${POSTGRES_USER:-ebf_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_in_production}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ebf_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ebf_user} -d ${POSTGRES_DB:-ebf_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: ebf_web
    ports:
      - "8180:8000"
    environment:
      DEBUG: ${DEBUG:-False}
      SECRET_KEY: ${SECRET_KEY:-change_me_in_production}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,ebf.simoesti.com.br}
      DATABASE_URL: postgresql://${POSTGRES_USER:-ebf_user}:${POSTGRES_PASSWORD:-change_me_in_production}@db:5432/${POSTGRES_DB:-ebf_db}
      POSTGRES_ENGINE: django.db.backends.postgresql
      POSTGRES_DB: ${POSTGRES_DB:-ebf_db}
      POSTGRES_USER: ${POSTGRES_USER:-ebf_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_in_production}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
    volumes:
      - static_volume:/app/ebf_project/staticfiles
      - media_volume:/app/ebf_project/media
    depends_on:
      db:
        condition: service_healthy
    networks:
      - ebf_network
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: ebf_nginx
    ports:
      - "8189:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - static_volume:/app/ebf_project/staticfiles
      - media_volume:/app/ebf_project/media
    depends_on:
      - web
    networks:
      - ebf_network
    restart: unless-stopped

volumes:
  postgres_data:
  static_volume:
  media_volume:

networks:
  ebf_network:
    driver: bridge
