{% extends "base.html" %}

{% block title %}Senha redefinida - EBF PIBVP{% endblock %}
{% block body_class %}auth-page{% endblock %}

{% block content %}
<div class="auth-card card">
    <div class="card-body text-center py-5">
        <i class="bi bi-shield-check text-success display-4"></i>
        <h1 class="h4 mt-3 title-brand">Senha redefinida</h1>
        <p class="text-muted">Sua senha foi atualizada. Você já pode entrar novamente no sistema.</p>
        <a class="btn btn-primary btn-lg" href="{% url 'accounts:login' %}">
            <i class="bi bi-box-arrow-in-right"></i> Ir para login
        </a>
    </div>
</div>
{% endblock %}
