{% extends "base.html" %}

{% block title %}Link enviado - EBF PIBVP{% endblock %}
{% block body_class %}auth-page{% endblock %}

{% block content %}
<div class="auth-card card">
    <div class="card-body text-center py-5">
        <i class="bi bi-envelope-check text-success display-4"></i>
        <h1 class="h4 mt-3 title-brand">Verifique seu e-mail</h1>
        <p class="text-muted">
            Se existir uma conta ativa com esse e-mail, enviaremos um link para redefinir a senha.
        </p>
        <a class="btn btn-primary btn-lg" href="{% url 'accounts:login' %}">
            <i class="bi bi-arrow-left"></i> Voltar ao login
        </a>
    </div>
</div>
{% endblock %}
