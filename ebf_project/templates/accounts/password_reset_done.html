{% extends "base.html" %}

{% block title %}Link enviado - EBF PIBVP{% endblock %}

{% block content %}
<div class="row">
    <div class="col-md-6 offset-md-3 col-lg-5 offset-lg-3">
        <div class="card">
            <div class="card-body text-center py-5">
                <i class="bi bi-envelope-check text-success display-5"></i>
                <h1 class="h4 mt-3">Verifique seu e-mail</h1>
                <p class="text-muted">
                    Se existir uma conta ativa com esse e-mail, enviaremos um link para redefinir a senha.
                </p>
                <a class="btn btn-primary" href="{% url 'accounts:login' %}">
                    <i class="bi bi-arrow-left"></i> Voltar ao login
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
